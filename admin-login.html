<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — The Ark Spa & Salon</title><link rel="preload" as="image" href="assets/ark-logo-reference.png"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=20260929-2"></script><script src="admin-auth-config.js?v=20260929-2"></script><style>
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#073f2d}
*{box-sizing:border-box}
.login-overlay{min-height:100svh;display:grid;place-items:center;padding:18px;background:rgba(3,31,22,.82)}
.login-window{width:min(380px,calc(100vw - 32px));background:#fffdf7;border:1px solid rgba(231,198,107,.58);border-radius:22px;box-shadow:0 24px 70px rgba(0,0,0,.38);overflow:hidden}
.login-head{padding:22px 22px 10px;text-align:center}
.brand-logo{width:76px;height:76px;object-fit:contain;display:block;margin:0 auto 9px}
.eyebrow{margin:0 0 4px;color:#c99a3a;font-size:10px;font-weight:800;letter-spacing:1.8px}
.login-head h1{margin:0;color:#073f2d;font:700 24px Georgia,serif}
.subtitle{margin:5px 0 14px;color:#607066;font-size:12px}
.form{display:grid;gap:10px;padding:0 22px 20px}
.field label{display:block;margin:0 0 5px;color:#073f2d;font-size:11px;font-weight:800}
.field input{width:100%;padding:11px 12px;border:1px solid #d8d1c2;border-radius:11px;background:#fff;color:#17392c;font-size:14px;outline:none}
.field input:focus{border-color:#c99a3a;box-shadow:0 0 0 3px rgba(201,154,58,.13)}
.login-btn{width:100%;border:0;border-radius:11px;padding:11px 14px;background:linear-gradient(135deg,#c99a3a,#e7c66b);color:#17301f;font-weight:900;font-size:13px;cursor:pointer;margin-top:1px}
.login-btn:disabled{opacity:.6;cursor:wait}
.status{min-height:18px;color:#a52c35;font-size:11px;font-weight:700;text-align:center}
.back{display:block;text-align:center;margin:-4px 0 18px;color:#073f2d;font-size:11px;font-weight:800;text-decoration:none}
.back:hover{color:#c99a3a}
@media(max-width:420px){.login-window{width:min(350px,calc(100vw - 28px))}.login-head{padding-top:19px}.form{padding-left:19px;padding-right:19px}.brand-logo{width:68px;height:68px}}
</style></head><body><div class="login-overlay"><main class="login-window"><div class="login-head"><section class="login-card"><img class="brand-logo" src="assets/ark-logo-reference.png" alt="The Ark Spa & Salon"><p class="eyebrow">THE ARK · ADMIN CENTER</p><h1>Secure Admin Login</h1><p class="subtitle">Sign in to manage The Ark Spa & Salon.</p><form id="newAdminLoginForm" class="form" novalidate><div class="field"><label for="adminEmail">Admin Email</label><input id="adminEmail" type="email" autocomplete="username" required></div><div class="field"><label for="adminPassword">Password</label><input id="adminPassword" type="password" autocomplete="current-password" required></div><button id="newAdminLoginButton" class="login-btn" type="submit">Login to Admin</button><div id="newAdminLoginMsg" class="status" role="alert" aria-live="polite"></div></form><a class="back" href="index.html">← Back to Website</a></div><form id="newAdminLoginForm" class="form" novalidate><div class="field"><label for="adminEmail">Admin Email</label><input id="adminEmail" type="email" autocomplete="username" required></div><div class="field"><label for="adminPassword">Password</label><input id="adminPassword" type="password" autocomplete="current-password" required></div><button id="newAdminLoginButton" class="login-btn" type="submit">Login to Admin</button><div id="newAdminLoginMsg" class="status" role="alert" aria-live="polite"></div></form><a class="back" href="index.html">← Back to Website</a></main></div><script>
(function(){
  const form=document.getElementById('newAdminLoginForm'),email=document.getElementById('adminEmail'),password=document.getElementById('adminPassword'),button=document.getElementById('newAdminLoginButton'),msg=document.getElementById('newAdminLoginMsg');
  function showError(text){msg.textContent=text||''}
  async function boot(){
    try{const user=await window.adminAuth.getCurrentAdmin();if(user){window.location.replace('admin.html');return}}catch(e){}
  }
  form.addEventListener('submit',async function(e){
    e.preventDefault();e.stopPropagation();showError('');
    if(!email.value.trim()||!password.value){showError('Please enter your admin email and password.');return}
    button.disabled=true;button.textContent='Signing in…';
    try{
      const result=await window.adminAuth.signInWithEmailAndPassword(email.value.trim(),password.value);
      if(!result||!result.user)throw new Error('Admin session was not created.');
      window.location.replace('admin.html');
    }catch(error){
      showError(error&&error.message?error.message:'Login failed. Please try again.');
      button.disabled=false;button.textContent='Login to Admin';
    }
  });
  boot();
})();
</script></body></html>
