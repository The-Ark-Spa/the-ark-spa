<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure Admin Setup — The Ark Spa</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f4f0e6;color:#173b2b;font-family:Arial,sans-serif}
main{width:min(420px,100%);padding:28px;background:#fffdf7;border:1px solid #dfcfaa;border-radius:20px;box-shadow:0 18px 55px #173b2b20}
h1{font:700 27px Georgia,serif;margin:0 0 8px}p{color:#66766b;line-height:1.5;font-size:14px}
label{display:block;margin:15px 0 6px;font-size:12px;font-weight:700}
input{width:100%;padding:13px;border:1px solid #d7d0c2;border-radius:10px;font-size:15px}
button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:#c99a3a;color:#17301f;font-weight:800;font-size:14px}
#message{min-height:22px;margin-top:14px;font-size:13px;color:#9b2932}
</style></head><body><main>
<h1>Admin Account Setup</h1><p>The Ark Spa & Salon · One-time secure setup. Choose a password with at least 14 characters. This page is disabled automatically after the first successful setup.</p>
<form id="setup">
<label for="code">One-time setup code</label><input id="code" autocomplete="off" required>
<label for="password">New Admin password</label><input id="password" type="password" minlength="14" autocomplete="new-password" required>
<label for="confirm">Confirm password</label><input id="confirm" type="password" minlength="14" autocomplete="new-password" required>
<button id="submit" type="submit">Create Admin Account</button><div id="message" role="status"></div>
</form></main>
<script>
const API='https://the-ark-spa-api.bundela-ar143.workers.dev';
const form=document.getElementById('setup'),message=document.getElementById('message'),button=document.getElementById('submit');
form.addEventListener('submit',async e=>{
 e.preventDefault();message.textContent='';
 const code=document.getElementById('code').value.trim(),password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;
 if(password!==confirm){message.textContent='Passwords do not match.';return}
 if(password.length<14){message.textContent='Use at least 14 characters.';return}
 button.disabled=true;button.textContent='Creating account…';
 try{
  const response=await fetch(API+'/api/admin/bootstrap',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({setupCode:code,password})});
  const result=await response.json();
  if(!response.ok||!result.ok)throw new Error(result.error||'Setup failed.');
  form.reset();message.style.color='#176b43';message.textContent='Admin account created. Open the Admin login page and sign in with ID: admin.';
 }catch(error){message.textContent=error.message||'Setup failed. Please retry.'}
 finally{button.disabled=false;button.textContent='Create Admin Account'}
});
</script></body></html>
